[project]
name = "cn-plus"
version = "1.2.0"
description = "Local search algorithms for the Crystal Structure Prediction problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22.0",
    "matplotlib>=3.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "spglib>=2.0.0",
]

[project.scripts]
cn-plus = "CN_plus.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["CN_plus"]
